name: CI

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '0 7 * * *'  # Every day at 07:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref}}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: clang-format
        run: pipx run --spec clang-format==23.1.5 clang-format --dry-run --Werror components/bq769x0/*.h components/bq769x0/*.cpp tests/*.cpp

      - name: ruff
        run: |
          pipx run --spec ruff==0.17.5 ruff check components
          pipx run --spec ruff==0.17.5 ruff format --check components

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Build and run
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I components tests/bq769x0_registers_test.cpp -o bq769x0_test
          ./bq769x0_test

  build:
    name: ${{ matrix.esphome-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        esphome-version:
          - stable
          - beta
          - dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Build
        uses: esphome/build-action@ae5408cdbc4f70692bf8e345c4982bca05a93667  # v8.1.0
        with:
          version: ${{ matrix.esphome-version }}
          yaml-file: bq769x0_demo.yaml
